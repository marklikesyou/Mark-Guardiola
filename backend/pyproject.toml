[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "markguardiola"
version = "0.1.0"
description = "Local-first probabilistic decision support for Italian Fantacalcio"
readme = {text = "Local-first probabilistic decision support for Italian Fantacalcio.", content-type = "text/plain"}
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [{name = "MarkGuardiola contributors"}]
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "duckdb>=1.3,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "joblib>=1.5,<2",
  "numpy>=2.1,<2.5",
  "ortools>=9.14,<10",
  "polars>=1.31,<2",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=20,<24",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "rapidfuzz>=3.13,<4",
  "redis>=6.2,<7",
  "rq>=2.4,<3",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4,<26",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
sources = [
  "soccerdata>=1.8,<2",
]
ml = [
  "catboost>=1.2.8,<2",
  "lightgbm>=4.6,<5",
  "numba>=0.64,<0.67",
  "optuna>=4.4,<5",
  "shap>=0.48,<1",
  "statsmodels>=0.14.5,<1",
  "xgboost>=3.0,<4",
]
dev = [
  "mypy>=1.16,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
markguardiola = "markguardiola.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/markguardiola"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
packages = ["markguardiola"]

[[tool.mypy.overrides]]
module = [
  "joblib",
  "sklearn.*",
  "lightgbm.*",
  "xgboost.*",
  "catboost.*",
  "scipy.*",
  "pyarrow.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "markguardiola.ml.preprocessing",
  "markguardiola.ml.baselines.counts",
]
disallow_subclassing_any = false
