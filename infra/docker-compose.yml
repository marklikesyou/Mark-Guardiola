name: markguardiola

x-backend: &backend
  build:
    context: ..
    dockerfile: infra/docker/backend.Dockerfile
  env_file:
    - ../.env
  volumes:
    - ../data:/app/data
    - ../artifacts:/app/artifacts
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-markguardiola}
      POSTGRES_USER: ${POSTGRES_USER:-markguardiola}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-markguardiola}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["markguardiola", "worker"]

volumes:
  postgres_data:
  redis_data:
