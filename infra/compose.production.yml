name: markguardiola-local

x-backend: &backend
  image: markguardiola-runtime:${MARK_IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: infra/docker/backend.Dockerfile
  environment: &environment
    MARK_ENVIRONMENT: production
    MARK_DATABASE_URL: postgresql+asyncpg://markguardiola:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/markguardiola
    MARK_MIGRATION_DATABASE_URL: postgresql+psycopg://markguardiola:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/markguardiola
    MARK_REDIS_URL: redis://redis:6379/0
    MARK_DATA_ROOT: /app/data
    MARK_ARTIFACT_ROOT: /app/artifacts
    MARK_CORS_ORIGINS: '["http://localhost:${MARK_HTTP_PORT:-3000}","http://127.0.0.1:${MARK_HTTP_PORT:-3000}"]'
    MARK_PUBLIC_BASE_URL: http://localhost:${MARK_HTTP_PORT:-3000}
    MARK_API_FOOTBALL_KEY: ${MARK_API_FOOTBALL_KEY:-}
    MARK_FOOTBALL_DATA_ORG_KEY: ${MARK_FOOTBALL_DATA_ORG_KEY:-}
    MARK_API_FOOTBALL_DAILY_LIMIT: ${MARK_API_FOOTBALL_DAILY_LIMIT:-100}
    MARK_DEFAULT_SIMULATIONS: ${MARK_DEFAULT_SIMULATIONS:-10000}
    MARK_LOG_LEVEL: ${MARK_LOG_LEVEL:-INFO}
    LOKY_MAX_CPU_COUNT: ${MARK_ML_CPUS:-2}
  volumes:
    - football_data:/app/data
    - model_artifacts:/app/artifacts
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  init: true
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: markguardiola
      POSTGRES_USER: markguardiola
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U markguardiola -d markguardiola"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    restart: "no"
  bootstrap:
    <<: *backend
    profiles: [setup]
    restart: "no"
    command: [markguardiola, install-data]
    environment:
      <<: *environment
      MARK_BOOTSTRAP_MODE: ${MARK_BOOTSTRAP_MODE:-auto}
      MARK_BUNDLE_FILE: ${MARK_BUNDLE_FILE:-}
      MARK_BUNDLE_SHA256: ${MARK_BUNDLE_SHA256:-}
    volumes:
      - football_data:/app/data
      - model_artifacts:/app/artifacts
      - type: bind
        source: ${MARK_BUNDLE_DIRECTORY:-../bundles}
        target: /bundles
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    <<: *backend
    command: [markguardiola, worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, markguardiola.release.health]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  frontend:
    image: markguardiola-frontend:${MARK_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MARK_HTTP_PORT:-3000}:8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  football_data:
  model_artifacts:
